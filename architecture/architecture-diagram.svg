<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">AWS Blue-Green and Canary Deployment Architecture</title>
  <desc id="desc">Route 53 sends HTTPS traffic to an Application Load Balancer, which distributes traffic between Blue and Green target groups and four EC2 servers.</desc>
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #17212b; }
      .label { font: 700 18px Arial, sans-serif; fill: #17212b; }
      .small { font: 15px Arial, sans-serif; fill: #40505c; }
      .box { stroke-width: 2; rx: 12; }
      .line { stroke: #52616b; stroke-width: 3; fill: none; }
      .arrow { fill: #52616b; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path class="arrow" d="M0,0 L10,5 L0,10 Z" />
    </marker>
  </defs>
  <rect width="1200" height="620" fill="#f6f8f7" />
  <text x="600" y="48" text-anchor="middle" class="title">AWS Blue-Green and Canary Deployment</text>

  <rect x="470" y="80" width="260" height="70" class="box" fill="#dcefe8" stroke="#2b7a61" />
  <text x="600" y="112" text-anchor="middle" class="label">Route 53</text>
  <text x="600" y="136" text-anchor="middle" class="small">Domain and DNS</text>

  <rect x="470" y="205" width="260" height="80" class="box" fill="#d9e8f5" stroke="#36739d" />
  <text x="600" y="239" text-anchor="middle" class="label">Application Load Balancer</text>
  <text x="600" y="263" text-anchor="middle" class="small">HTTPS :443 | Redirect HTTP :80</text>

  <path d="M600 150 L600 205" class="line" marker-end="url(#arrow)" />

  <rect x="135" y="370" width="370" height="180" class="box" fill="#e7f0f8" stroke="#36739d" />
  <text x="320" y="408" text-anchor="middle" class="label">Blue Target Group</text>
  <text x="320" y="433" text-anchor="middle" class="small">Production | 90% to 0% traffic</text>
  <rect x="175" y="465" width="125" height="55" class="box" fill="#ffffff" stroke="#7aa2bd" />
  <rect x="340" y="465" width="125" height="55" class="box" fill="#ffffff" stroke="#7aa2bd" />
  <text x="237" y="498" text-anchor="middle" class="small">Server 1</text>
  <text x="402" y="498" text-anchor="middle" class="small">Server 2</text>

  <rect x="695" y="370" width="370" height="180" class="box" fill="#fff1d9" stroke="#b87927" />
  <text x="880" y="408" text-anchor="middle" class="label">Green Target Group</text>
  <text x="880" y="433" text-anchor="middle" class="small">Candidate | 10% to 100% traffic</text>
  <rect x="735" y="465" width="125" height="55" class="box" fill="#ffffff" stroke="#c59b5b" />
  <rect x="900" y="465" width="125" height="55" class="box" fill="#ffffff" stroke="#c59b5b" />
  <text x="797" y="498" text-anchor="middle" class="small">Server 3</text>
  <text x="962" y="498" text-anchor="middle" class="small">Server 4</text>

  <path d="M530 285 C470 320 380 345 320 370" class="line" marker-end="url(#arrow)" />
  <path d="M670 285 C730 320 820 345 880 370" class="line" marker-end="url(#arrow)" />
</svg>
